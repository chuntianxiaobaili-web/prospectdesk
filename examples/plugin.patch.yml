# Replace all /absolute/path placeholders. No live mailbox adapter is installed.
# dsh web --patch /absolute/path/plugin.patch.yml
- insert:
    - id: b2b-sales-workflow
      name: /absolute/path/fsarcan-sales-plugin/src/plugin.js
      config:
        directory: /absolute/path/cloud-data/sales-state
        importDirectory: /absolute/path/cloud-data/imports
        exportDirectory: /absolute/path/cloud-data/exports
        workbookMapping:
          leadSheet: 客户清单
          evidenceSheet: 研究依据
          key: 编号
          evidenceTypeColumn: 证据类型
          emailEvidenceType: 官方商务邮箱
          evidenceColumns:
            evidence: 核实内容
            sourceUrl: 官方来源链接
            sourceDate: 来源读取日期
        config:
          brand:
            name: Your brand
            products: [Your product]
            verifiedFacts: []
            unknowns: [price, inventory, lead time]
          accountId: replace-with-verified-account-identity
          draftModel:
            provider: replace-with-configured-provider
            model: replace-with-exact-provider-model-id
          minimumIntervalSeconds: 180
